<!doctype html><html><body>
<audio id="a" loop></audio>
<script>
// a player living in a frame: ?el plays an <audio> element, ?wa plays through Web Audio
function wavDataUrl(freq, secs){ const sr=44100,n=sr*secs; const b=new ArrayBuffer(44+n*2), v=new DataView(b);
 const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.sin(2*Math.PI*freq*i/sr)*12000,true);
 let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return 'data:audio/wav;base64,'+btoa(s);}
if (location.search === '?wa') {
  const c=new AudioContext(), o=c.createOscillator(), g=c.createGain(); g.gain.value=0.5; o.connect(g); g.connect(c.destination); o.start();
} else {
  const a=document.getElementById('a'); a.src=wavDataUrl(480,5); a.play();
}
</script></body></html>
